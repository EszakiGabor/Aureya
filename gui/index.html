const audio=document.getElementById('audio');
let audioCtx,analyser,dataArray,source,audioReady=false;

function setupAudio(){
  if(audioReady)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=256;
  dataArray=new Uint8Array(analyser.frequencyBinCount);
  source=audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  audioReady=true;
}

function getAudio(){
  if(!audioReady){return{bass:0,mid:0,avg:0};}
  analyser.getByteFrequencyData(dataArray);
  const bass=dataArray.slice(0,8).reduce((a,b)=>a+b,0)/8/255;
  const mid=dataArray.slice(8,32).reduce((a,b)=>a+b,0)/24/255;
  const avg=dataArray.slice(0,64).reduce((a,b)=>a+b,0)/64/255;
  return{bass,mid,avg};
}

const fc=document.getElementById('fc-canvas'),fctx=fc.getContext('2d');
let fcN=[],fcT=0;
function initFC(){
  const r=document.getElementById('right-screen').getBoundingClientRect();
  const w=r.width-6,h=Math.min(r.height*.34,80);
  fc.width=w*devicePixelRatio;fc.height=h*devicePixelRatio;fc.style.height=h+'px';
  fctx.scale(devicePixelRatio,devicePixelRatio);
  fcN=[];for(let i=0;i<20;i++)fcN.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.3+.8});
}
function drawFC(bass){
  if(!fc.width)return;
  const w=fc.width/devicePixelRatio,h=fc.height/devicePixelRatio;
  fctx.clearRect(0,0,w,h);fcT+=.008+bass*.02;
  for(let n of fcN){n.x+=n.vx+Math.sin(fcT+n.y*.05)*.1;n.y+=n.vy+Math.cos(fcT+n.x*.05)*.1;if(n.x<0)n.x=w;if(n.x>w)n.x=0;if(n.y<0)n.y=h;if(n.y>h)n.y=0;}
  for(let i=0;i<fcN.length;i++)for(let j=i+1;j<fcN.length;j++){
    const dx=fcN[i].x-fcN[j].x,dy=fcN[i].y-fcN[j].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<60){fctx.strokeStyle='rgba(0,255,100,'+(((1-d/60)*.5)).toFixed(2)+')';fctx.lineWidth=.5;fctx.beginPath();fctx.moveTo(fcN[i].x,fcN[i].y);fctx.lineTo(fcN[j].x,fcN[j].y);fctx.stroke();}
  }
  for(let n of fcN){
    fctx.fillStyle='rgba(0,255,136,1)';
    fctx.shadowBlur=5+bass*15;fctx.shadowColor='#00ff66';
    fctx.beginPath();fctx.arc(n.x,n.y,n.r*(1+bass*.5),0,Math.PI*2);fctx.fill();
  }
  fctx.shadowBlur=0;
}

const hb=document.getElementById('hb-canvas'),hbx=hb.getContext('2d');
let hbD=[],hbT=0;
function initHB(){
  const w=document.getElementById('right-screen').getBoundingClientRect().width-6,h=18;
  hb.width=w*devicePixelRatio;hb.height=h*devicePixelRatio;hb.style.height=h+'px';hbx.scale(devicePixelRatio,devicePixelRatio);
}
function ecg(t){const p=t%1;if(p<.1)return Math.sin(p/.1*Math.PI)*.28;if(p<.15)return-.1;if(p<.18)return 1;if(p<.22)return-.48;if(p<.28)return.18;return 0;}
function drawHB(bass){
  if(!hb.width)return;const w=hb.width/devicePixelRatio,h=hb.height/devicePixelRatio;
  hbx.clearRect(0,0,w,h);hbT+=.038+bass*.03;hbD.push(ecg(hbT));if(hbD.length>w)hbD.shift();
  hbx.strokeStyle='#00ff66';hbx.lineWidth=1;hbx.shadowBlur=3+bass*8;hbx.shadowColor='#00ff44';
  hbx.beginPath();for(let i=0;i<hbD.length;i++){const y=h/2-hbD[i]*(h/2-1);i===0?hbx.moveTo(i,y):hbx.lineTo(i,y);}hbx.stroke();hbx.shadowBlur=0;
}

function drawWave(){
  const bars=document.querySelectorAll('.wb');
  if(!audioReady){bars.forEach(b=>b.style.height=(12+Math.random()*30)+'%');return;}
  analyser.getByteFrequencyData(dataArray);
  bars.forEach((b,i)=>{
    const idx=Math.floor(i/bars.length*64);
    const h=Math.max(5,(dataArray[idx]/255)*95);
    b.style.height=h+'%';
    b.style.background=h>70?'#00ffaa':h>40?'#00ff66':'#00aa44';
    b.style.boxShadow=h>60?'0 0 '+Math.floor(h/10)+'px #00ff44':'none';
  });
}

  glowT+=.03;
  const v=Math.min(1,0.35+Math.sin(glowT)*.2+bass*1.2);
  const v1=v*.6,v2=v*.3,v3=v*.65,v4=v*.28;
  spk.style.background='radial-gradient(ellipse at 48% 45%,rgba(100,0,255,'+v1.toFixed(2)+') 0%,rgba(60,80,255,'+v2.toFixed(2)+') 40%,transparent 70%)';
  lmp.style.background='radial-gradient(ellipse at 50% 40%,rgba(140,0,255,'+v3.toFixed(2)+') 0%,rgba(80,0,200,'+v4.toFixed(2)+') 45%,transparent 72%)';
}

function lclass(l){
  if(l==='---')return 'ls';
  if(l.startsWith('<3')||l.includes('ᵔ')||l.includes('˃')||l.includes('♡'))return 'lh';
  if(l.startsWith('[END')||l.startsWith('AUREYA SYSTEMS')||l.startsWith('ANALOG'))return 'tb';
  if(l.startsWith('>'))return 'lc';
  return 'ln';
}

function checkLyrics(){
  if(!lyricEl)return;
  const t=audio.currentTime;
  // Show all lines whose time has come, in order
  while(nextLyricIdx<LYRIC_TIMES.length && t>=LYRIC_TIMES[nextLyricIdx][0]){
    showLyricLine(LYRIC_TIMES[nextLyricIdx][1]);
    nextLyricIdx++;
  }
  const pct=(t/audio.duration)*100||0;
  document.getElementById('audio-fill').style.width=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('res-bar').style.width=Math.min(pct,91)+'%';
  document.getElementById('res-val').textContent=Math.floor(Math.min(pct,91))+'%';
  const cur=Math.floor(t),m=Math.floor(cur/60),s=String(cur%60).padStart(2,'0');
  document.getElementById('cur-time').textContent=m+':'+s;
  document.getElementById('bpm-val').textContent=Math.floor(82+getAudio().bass*40);
}

function showLyricLine(line){
  const c=lclass(line);
  const el=document.createElement('div');el.className='ll '+c;
  if(c==='ls'){el.textContent='── ✦ ──';el.style.textAlign='center';el.style.color='#004422';el.style.letterSpacing='4px';}
  else{el.textContent=line;}
  if(currentLineEl)currentLineEl.classList.remove('current');
  lyricEl.appendChild(el);
  setTimeout(()=>{el.classList.add('on');if(c!=='ls'){el.classList.add('current');currentLineEl=el;}},50);
  prune();
  lyricEl.scrollTop=lyricEl.scrollHeight;
}

function prune(){
  const ls=lyricEl.querySelectorAll('.ll');
  if(ls.length>3)for(let i=0;i<ls.length-3;i++){ls[i].classList.add('off');setTimeout(()=>ls[i].remove(),360);}

  document.getElementById('cursor-line').style.display='none';
  const ov=document.getElementById('terminal-overlay');ov.innerHTML='';let i=0;
  (function n(){if(i>=END.length)return;const el=document.createElement('div');el.className='t tb';el.style.fontSize='clamp(7px,1.1vw,13px)';el.textContent=END[i++];ov.appendChild(el);setTimeout(n,520);})();
}

function startUptime(){
  const s=Date.now();document.getElementById('uptime').style.display='block';
  setInterval(()=>{const d=Math.floor((Date.now()-s)/1000),h=String(Math.floor(d/3600)).padStart(2,'0'),m=String(Math.floor(d%3600/60)).padStart(2,'0'),sec=String(d%60).padStart(2,'0');document.getElementById('uptime').textContent='UPTIME: '+h+':'+m+':'+sec;},1000);
}

function runBoot(cb){
  const area=document.getElementById('boot-area');let i=0;
  (function next(){
    if(i>=BOOT.length){cb();return;}
    const line=BOOT[i++],el=document.createElement('div');el.className='t td bl';
    el.innerHTML=line.includes('ONLINE')?line.replace('ONLINE','<span class="tb">ONLINE</span>'):line.replace('OK','<span style="color:#00ff66;text-shadow:0 0 5px #00ff44">OK</span>');
    area.appendChild(el);setTimeout(next,180);
  })();
}

function runOverlay(){
  const ov=document.getElementById('terminal-overlay');ov.style.display='block';let i=0;
  (function n(){if(i>=OVERLAY.length)return;const el=document.createElement('div');el.className='t tc';el.style.fontSize='clamp(4px,.75vw,9px)';el.textContent=OVERLAY[i++];ov.appendChild(el);setTimeout(n,300);})();
}

audio.addEventListener('ended',showEnd);

let started=false;
function startSequence(){
  if(started)return;started=true;
  document.getElementById('play-btn').style.display='none';
  buildStats();setupAudio();
  runBoot(()=>{
    document.getElementById('boot-area').style.display='none';
    document.getElementById('sep2').style.display='block';
    document.getElementById('lyric-display').style.display='block';
    document.getElementById('prog-bar').style.display='block';
    document.getElementById('cursor-line').style.display='block';
    document.getElementById('waveform').style.display='flex';
    lyricEl=document.getElementById('lyric-display');
    startHeart();startUptime();
    audio.play();
  });
}

function loop(){
  const {bass}=getAudio();
  drawFC(bass);drawHB(bass);drawWave();updateGlow(bass);
  if(started&&!audio.paused)checkLyrics();
  requestAnimationFrame(loop);
}
window.addEventListener('load',()=>{setTimeout(()=>{initFC();initHB();loop();},150);});
window.addEventListener('resize',()=>{initFC();initHB();});

</script>
</body>
</html>
