<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mushroom Planet</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#0a0015;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100dvh; font-family:'Courier New',monospace; overflow:hidden; touch-action:none;
  }
  #gameContainer { position:relative; }
  canvas { display:block; border:2px solid #ff6bff; box-shadow:0 0 20px #ff6bff66; }
  #ui {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; padding:6px 10px;
    pointer-events:none; z-index:10;
  }
  .stat {
    color:#fff; font-size:13px; text-shadow:0 0 8px #ff6bff;
    background:rgba(0,0,0,0.6); padding:3px 8px; border-radius:4px;
    border:1px solid #ff6bff44;
  }
  #screen {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(10,0,21,0.93); z-index:20; padding:10px;
  }
  #screen h1 {
    font-size:clamp(22px,6vw,42px); color:#ff6bff;
    text-shadow:0 0 20px #ff6bff,0 0 40px #8800ff;
    letter-spacing:3px; margin-bottom:4px; text-align:center;
  }
  #screen h2 {
    font-size:clamp(11px,3vw,16px); color:#ffcc00;
    text-shadow:0 0 10px #ffcc00; margin-bottom:14px; letter-spacing:2px;
  }
  #screen p { color:#aaa; font-size:clamp(10px,2.5vw,13px); margin:3px 0; text-align:center; }
  .btn {
    margin-top:16px; padding:10px 28px;
    background:#ff6bff22; border:2px solid #ff6bff; color:#ff6bff;
    font-size:clamp(14px,4vw,18px); font-family:'Courier New',monospace;
    cursor:pointer; letter-spacing:3px; text-shadow:0 0 8px #ff6bff;
    animation:pulse 1.5s ease-in-out infinite; border-radius:4px;
  }
  @keyframes pulse {
    0%,100%{box-shadow:0 0 10px #ff6bff44;} 50%{box-shadow:0 0 25px #ff6bff99;}
  }
  .chars { display:flex; gap:16px; margin:8px 0 14px; }
  .char {
    text-align:center; color:#fff; font-size:clamp(10px,2.5vw,13px);
    cursor:pointer; padding:8px 14px; border-radius:8px; transition:all 0.2s;
  }
  .char-icon { font-size:clamp(24px,6vw,34px); display:block; margin-bottom:3px; }

  /* Touch controls */
  #touchControls {
    display:none; position:absolute; bottom:0; left:0; right:0;
    height:120px; z-index:15; pointer-events:none;
  }
  #touchControls.active { display:flex; justify-content:space-between; align-items:flex-end; padding:10px 16px; }
  .dpad { display:flex; gap:6px; pointer-events:all; }
  .tbtn {
    width:56px; height:56px; border-radius:50%;
    background:rgba(255,107,255,0.25); border:2px solid #ff6bff88;
    color:#ff6bff; font-size:22px; display:flex; align-items:center; justify-content:center;
    user-select:none; cursor:pointer; active:background:rgba(255,107,255,0.5);
  }
  .tbtn:active { background:rgba(255,107,255,0.5); }
  #jumpBtn {
    width:70px; height:70px; border-radius:50%;
    background:rgba(0,255,204,0.25); border:2px solid #00ffcc88;
    color:#00ffcc; font-size:28px; display:flex; align-items:center; justify-content:center;
    pointer-events:all; cursor:pointer; user-select:none;
  }
  #jumpBtn:active { background:rgba(0,255,204,0.5); }
</style>
</head>
<body>
<div id="gameContainer">
  <audio id="bgm" loop>
    <source src="https://files.catbox.moe/53lwic.mp3" type="audio/mpeg">
  </audio>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div class="stat">🍄 <span id="coins">0</span></div>
    <div class="stat" id="levelLabel">MUSHROOM VILLAGE</div>
    <div class="stat">❤️ <span id="lives">3</span></div>
  </div>
  <div id="screen">
    <h1>🍄 MUSHROOM PLANET 🍄</h1>
    <h2>CHOOSE YOUR CHARACTER</h2>
    <div class="chars">
      <div class="char" id="sel-crt" onclick="selectChar('crt')" style="border:2px solid #00ffcc;background:#00ffcc22">
        <span class="char-icon">📺</span>
        <b style="color:#00ffcc">CRT HEAD</b><br>
        <span style="color:#aaa;font-size:10px">Arrows / WASD</span>
      </div>
      <div class="char" id="sel-aureya" onclick="selectChar('aureya')" style="border:2px solid #444;background:#ff6bff11">
        <span class="char-icon">🤖</span>
        <b style="color:#ff6bff">AUREYA</b><br>
        <span style="color:#aaa;font-size:10px">Arrows / WASD</span>
      </div>
    </div>
    <p style="color:#ffcc00">🍄 Collect mushrooms &nbsp;|&nbsp; ⚠️ Avoid enemies &nbsp;|&nbsp; 🏁 Reach the flag!</p>
    <button class="btn" onclick="startGame()">▶ PRESS START</button>
  </div>
  <div id="touchControls">
    <div class="dpad">
      <div class="tbtn" id="btnLeft">◀</div>
      <div class="tbtn" id="btnRight">▶</div>
    </div>
    <div id="jumpBtn">▲</div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Responsive size
let W, H;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const aspect = 8/5;
  if (vw/vh > aspect) { H = Math.min(vh, 520); W = Math.floor(H * aspect); }
  else { W = Math.min(vw, 800); H = Math.floor(W / aspect); }
  canvas.width = W; canvas.height = H;
  document.getElementById('gameContainer').style.width = W+'px';
  document.getElementById('gameContainer').style.height = H+'px';
}
resize();
window.addEventListener('resize', () => { resize(); });

const isMobile = ('ontouchstart' in window);

const LEVELS = [
  { name:"MUSHROOM VILLAGE", bg:['#1a0035','#2d0055'], ground:'#4a2080', accent:'#ff6bff' },
  { name:"FLOATING ISLANDS", bg:['#001a3a','#003366'], ground:'#1a4a8a', accent:'#00ccff' },
  { name:"DREAM FOREST",     bg:['#001a00','#003300'], ground:'#1a5a1a', accent:'#00ff88' },
  { name:"COSMIC RIVER",     bg:['#0a0020','#1a0040'], ground:'#3a0080', accent:'#aa44ff' },
  { name:"FUNGI KINGDOM",    bg:['#2a0000','#550000'], ground:'#7a1a00', accent:'#ff4400' },
];

let state='menu', level=0, coins=0, lives=3, timer=0;
let camera={x:0};
let selectedChar='crt';

function selectChar(c) {
  selectedChar=c;
  document.getElementById('sel-crt').style.border = c==='crt'?'2px solid #00ffcc':'2px solid #444';
  document.getElementById('sel-crt').style.background = c==='crt'?'#00ffcc22':'#00ffcc05';
  document.getElementById('sel-aureya').style.border = c==='aureya'?'2px solid #ff6bff':'2px solid #444';
  document.getElementById('sel-aureya').style.background = c==='aureya'?'#ff6bff22':'#ff6bff05';
}

const TILE = Math.floor(W/20);
const MAP_W = 40;

// Keys & touch
let keys={};
let touch={left:false,right:false,jump:false};

document.addEventListener('keydown',e=>{keys[e.key]=true;});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function setupTouch() {
  const tc = document.getElementById('touchControls');
  if (isMobile) tc.classList.add('active');

  function hold(el, prop) {
    el.addEventListener('touchstart',e=>{e.preventDefault();touch[prop]=true;},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();touch[prop]=false;},{passive:false});
    el.addEventListener('touchcancel',e=>{touch[prop]=false;},{passive:false});
  }
  hold(document.getElementById('btnLeft'),'left');
  hold(document.getElementById('btnRight'),'right');
  hold(document.getElementById('jumpBtn'),'jump');
}

// Sound
let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function beep(freq,dur,type='square',vol=0.3,slide=0){
  try{const ac=getAudio();const o=ac.createOscillator();const g=ac.createGain();
  o.connect(g);g.connect(ac.destination);o.type=type;
  o.frequency.setValueAtTime(freq,ac.currentTime);
  if(slide)o.frequency.linearRampToValueAtTime(slide,ac.currentTime+dur);
  g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  o.start(ac.currentTime);o.stop(ac.currentTime+dur);}catch(e){}
}
function noise(dur,vol=0.2){
  try{const ac=getAudio();const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();const g=ac.createGain();
  src.buffer=buf;src.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);src.start();}catch(e){}
}
const SFX={
  jump(){beep(300,0.08,'square',0.25,600);},
  coin(){beep(880,0.07,'square',0.25);setTimeout(()=>beep(1320,0.1,'square',0.2),70);},
  stomp(){beep(200,0.05,'square',0.3,80);noise(0.06,0.15);},
  die(){beep(440,0.1,'square',0.3,220);setTimeout(()=>beep(220,0.1,'square',0.25,110),100);setTimeout(()=>beep(110,0.15,'square',0.2,55),200);},
  levelUp(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.25),i*80));},
  start(){[262,330,392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'square',0.2),i*60));},
  win(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'square',0.25),i*100));setTimeout(()=>beep(1047,0.4,'square',0.3),600);},
  flag(){beep(660,0.08,'square',0.2,880);setTimeout(()=>beep(880,0.15,'square',0.25),80);}
};

// Level builder
function buildLevel(lvl) {
  let platforms=[],enemies=[],flyers=[],spikes=[],movingPlatforms=[],mushrooms=[];
  const t=TILE;
  const difficulty = lvl + 1; // 1-5

  // Ground
  for(let x=0;x<MAP_W;x++) platforms.push({x:x*t,y:H-t,w:t,h:t});

  // Platforms - more as level increases
  const pData=[
    [3,8],[5,6],[7,9],[10,7],[12,5],[15,8],[18,6],[21,7],
    [24,5],[27,8],[30,6],[33,7],[36,5],[8,4],[20,4],[32,4]
  ];
  pData.forEach(([px,py])=>{
    const pw = 2 + Math.floor(Math.random()*2);
    for(let i=0;i<pw;i++) platforms.push({x:(px+i)*t,y:py*(H/12),w:t,h:t/2});
  });

  // Moving platforms
  const mpCount = 2 + difficulty;
  for(let i=0;i<mpCount;i++){
    let mx = (5 + i*8)*t;
    let my = H - (3+i%3)*t - 40;
    movingPlatforms.push({
      x:mx, y:my, w:t*2, h:t/2,
      startX:mx, rangeX: (i%2===0)?t*3:0,
      startY:my, rangeY: (i%2===1)?t*2:0,
      speed:1+i*0.3, phase:i*1.1
    });
  }

  // Ground enemies
  const eCount = 3 + difficulty*2;
  for(let i=0;i<eCount;i++){
    let ex = (5+i*4)*t;
    enemies.push({x:ex,y:H-2*t,vx:1+difficulty*0.3,w:28,h:28,dir:i%2?1:-1,ground:H-t,dead:false,type:'ground'});
  }

  // Flying enemies 🦇
  const fCount = 1 + difficulty;
  for(let i=0;i<fCount;i++){
    let fx = (8+i*7)*t;
    let fy = H*0.3 + (i%3)*60;
    flyers.push({x:fx,y:fy,baseY:fy,vx:1.5+difficulty*0.2,dir:i%2?1:-1,w:30,h:20,dead:false,phase:i*2.1});
  }

  // Spikes on ground
  const sCount = 3 + difficulty*2;
  for(let i=0;i<sCount;i++){
    let sx = (4+i*5)*t + t/2;
    // avoid start area
    if(sx < 3*t) continue;
    spikes.push({x:sx, y:H-t});
  }

  // Mushrooms - random placement on platforms and ground
  for(let i=0;i<25;i++){
    let px = (3+i*1.7)*t + Math.random()*t;
    let py = H-2*t - Math.floor(Math.random()*4)*t*1.5;
    py = Math.max(t*2, Math.min(py, H-2*t));
    mushrooms.push({x:px, y:py, collected:false});
  }

  return {platforms,enemies,flyers,spikes,movingPlatforms,mushrooms,flag:{x:(MAP_W-2)*t,y:H-3*t}};
}

function makePlayer(x,color,isP1){
  return {x,y:H-2.5*TILE,vx:0,vy:0,w:28,h:38,onGround:false,color,isP1,dead:false,respawnTimer:0,faceDir:1,invincible:0,hitCount:0};
}

let p1,levelData;

function startGame(){
  level=0;coins=0;lives=3;timer=0;
  document.getElementById('screen').style.display='none';
  levelData=buildLevel(level);
  p1=makePlayer(80,selectedChar==='crt'?'#00ffcc':'#ff6bff',selectedChar==='crt');
  SFX.start();
  setupTouch();
  document.getElementById('bgm').volume=0.5;
  document.getElementById('bgm').play().catch(()=>{});
  state='playing';
  requestAnimationFrame(loop);
}

function nextLevel(){
  level++;
  if(level>=LEVELS.length){showWin();return;}
  SFX.levelUp();
  levelData=buildLevel(level);
  p1.x=80;p1.y=H-2.5*TILE;p1.vx=0;p1.vy=0;p1.dead=false;
  camera.x=0;
  document.getElementById('levelLabel').textContent=LEVELS[level].name;
}

function showScreen(html){
  const s=document.getElementById('screen');
  s.style.display='flex';s.innerHTML=html;
}

function showWin(){
  SFX.win();
  document.getElementById('bgm').pause();
  state='win';
  showScreen(`<h1>🎉 YOU WIN! 🎉</h1><h2 style="color:#ffcc00">FUNGI KINGDOM SAVED!</h2>
  <p style="color:#00ffcc;font-size:16px">🍄 ${coins} mushrooms &nbsp;|&nbsp; ❤️ ${lives} lives left</p>
  <button class="btn" onclick="location.reload()">▶ PLAY AGAIN</button>`);
}

function showGameOver(){
  document.getElementById('bgm').pause();
  state='gameover';
  showScreen(`<h1 style="color:#ff4444">GAME OVER</h1>
  <h2 style="color:#ff6bff">DREAM STATION 21 DERAILED</h2>
  <p style="color:#aaa">🍄 Mushrooms collected: ${coins}</p>
  <button class="btn" onclick="location.reload()">▶ TRY AGAIN</button>`);
}

function playerInput(p){
  const spd=3.5;
  if(p.dead)return;
  const left  = keys['a']||keys['A']||keys['ArrowLeft']||touch.left;
  const right = keys['d']||keys['D']||keys['ArrowRight']||touch.right;
  const jump  = keys['w']||keys['W']||keys['ArrowUp']||keys[' ']||touch.jump;
  if(left){p.vx=-spd;p.faceDir=-1;}
  else if(right){p.vx=spd;p.faceDir=1;}
  else p.vx=0;
  if(jump&&p.onGround){p.vy=-11;SFX.jump();touch.jump=false;}
}

function applyPhysics(p,platforms){
  if(p.dead){p.respawnTimer--;if(p.respawnTimer<=0){p.dead=false;p.x=80;p.y=H-2.5*TILE;p.vy=0;}return;}
  p.vy+=0.5;p.x+=p.vx;p.y+=p.vy;p.onGround=false;
  const allPlats=[...platforms,...levelData.movingPlatforms];
  for(let pl of allPlats){
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w){
      if(p.y+p.h>pl.y&&p.y+p.h<pl.y+pl.h+16&&p.vy>=0){
        p.y=pl.y-p.h;p.vy=0;p.onGround=true;
      }
    }
  }
  if(p.y>H+50){lives--;p.dead=true;p.respawnTimer=90;SFX.die();if(lives<=0)showGameOver();}
  if(p.x<0)p.x=0;
  if(p.x+p.w>MAP_W*TILE)p.x=MAP_W*TILE-p.w;
}

function checkCollisions(p){
  if(p.dead)return;
  if(p.invincible>0)p.invincible--;

  // Ground enemies
  for(let e of levelData.enemies){
    if(!e.dead&&Math.abs(p.x+p.w/2-e.x-e.w/2)<(p.w/2+e.w/2)&&Math.abs(p.y+p.h/2-e.y-e.h/2)<(p.h/2+e.h/2)){
      if(p.vy>0&&p.y+p.h<e.y+e.h/2+10){e.dead=true;p.vy=-7;coins+=2;SFX.stomp();}
      else if(p.invincible<=0){lives--;p.dead=true;p.respawnTimer=90;SFX.die();if(lives<=0)showGameOver();}
    }
  }
  // Flying enemies
  for(let f of levelData.flyers){
    if(!f.dead&&Math.abs(p.x+p.w/2-f.x-f.w/2)<(p.w/2+f.w/2)&&Math.abs(p.y+p.h/2-f.y-f.h/2)<(p.h/2+f.h/2)){
      if(p.invincible<=0){lives--;p.dead=true;p.respawnTimer=90;SFX.die();if(lives<=0)showGameOver();}
    }
  }
  // Spikes
  for(let s of levelData.spikes){
    if(p.x+p.w>s.x-10&&p.x<s.x+10&&p.y+p.h>s.y+4&&p.y+p.h<s.y+TILE){
      if(p.invincible<=0){lives--;p.dead=true;p.respawnTimer=90;SFX.die();if(lives<=0)showGameOver();}
    }
  }
  // Mushrooms
  for(let m of levelData.mushrooms){
    if(!m.collected&&Math.abs(p.x+p.w/2-m.x)<24&&Math.abs(p.y+p.h/2-m.y)<24){
      m.collected=true;coins++;p.hitCount++;SFX.coin();
      // Every 5 mushrooms: invincibility 1-3 sec (60-180 frames)
      if(p.hitCount%5===0){
        const dur = 60 + Math.floor(Math.random()*120);
        p.invincible=dur;
        beep(880,0.05,'square',0.3,1200);
        setTimeout(()=>beep(1200,0.1,'square',0.3),60);
        setTimeout(()=>beep(1500,0.15,'square',0.25),130);
      }
    }
  }
  let f=levelData.flag;
  if(Math.abs(p.x+p.w/2-f.x)<40&&Math.abs(p.y+p.h/2-f.y)<60){SFX.flag();nextLevel();}
}

function updateEnemies(){
  for(let e of levelData.enemies){
    if(e.dead)continue;
    e.x+=e.vx*e.dir;
    if(e.x<0||e.x>(MAP_W-1)*TILE)e.dir*=-1;
    e.y=e.ground-e.h;
  }
  // Flyers
  for(let f of levelData.flyers){
    if(f.dead)continue;
    f.x+=f.vx*f.dir;
    if(f.x<0||f.x>(MAP_W-1)*TILE)f.dir*=-1;
    f.y=f.baseY+Math.sin(timer*0.04+f.phase)*40;
  }
  // Moving platforms
  for(let mp of levelData.movingPlatforms){
    mp.x=mp.startX+Math.sin(timer*0.02+mp.phase)*mp.rangeX;
    mp.y=mp.startY+Math.sin(timer*0.025+mp.phase)*mp.rangeY;
    // Carry player
    if(!p1.dead&&p1.onGround){
      if(p1.x+p1.w>mp.x&&p1.x<mp.x+mp.w&&Math.abs(p1.y+p1.h-mp.y)<8){
        p1.x+=Math.sin(timer*0.02+mp.phase)*mp.rangeX*0.02;
      }
    }
  }
}

function updateCamera(){
  let target=p1.x-W/2+p1.w/2;
  camera.x+=(Math.max(0,Math.min(target,MAP_W*TILE-W))-camera.x)*0.12;
}

// Drawing
function drawBG(){
  const lv=LEVELS[level%LEVELS.length];
  let grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,lv.bg[0]);grad.addColorStop(1,lv.bg[1]);
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffffff33';
  for(let i=0;i<50;i++){
    let sx=((i*137+timer*0.2)%(MAP_W*TILE)-camera.x*0.3)%W;
    let sy=(i*73)%(H*0.7);
    ctx.fillRect(sx,sy,2,2);
  }
  for(let i=0;i<6;i++){
    let bx=(i*350-camera.x*0.35)%(W+300)-150;
    drawMushroomBG(bx,H-50-(i%3)*35,24+(i%3)*12,lv.accent+'33');
  }
}

function drawMushroomBG(x,y,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,Math.PI,0);ctx.fill();
  ctx.fillRect(x-r*0.3,y,r*0.6,r*0.8);
}

function drawMushroom(x,y,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,Math.PI,0);ctx.fill();
  ctx.fillStyle='#ffffff88';
  ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.3,r*0.25,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a1a00';ctx.fillRect(x-r*0.25,y,r*0.5,r*0.8);
}

function drawPlatforms(){
  const lv=LEVELS[level%LEVELS.length];
  for(let pl of levelData.platforms){
    let sx=pl.x-camera.x;
    if(sx>W+100||sx<-100)continue;
    ctx.fillStyle=lv.ground;ctx.fillRect(sx,pl.y,pl.w,pl.h);
    ctx.fillStyle=lv.accent+'88';ctx.fillRect(sx,pl.y,pl.w,4);
    if(pl.h<TILE&&Math.floor(pl.x/TILE)%4===0)drawMushroom(sx+pl.w/2,pl.y-8,7,lv.accent);
  }
}

function drawCollectibles(){
  const lv=LEVELS[level%LEVELS.length];
  for(let m of levelData.mushrooms){
    if(m.collected)continue;
    let sx=m.x-camera.x;
    if(sx<-30||sx>W+30)continue;
    let bob=Math.sin(timer*0.05+m.x)*3;
    drawMushroom(sx,m.y-8+bob,10,lv.accent);
  }
}

function drawEnemies(){
  for(let e of levelData.enemies){
    if(e.dead)continue;
    let sx=e.x-camera.x;
    if(sx<-50||sx>W+50)continue;
    ctx.fillStyle='#ff4444';
    ctx.beginPath();ctx.arc(sx+e.w/2,e.y+9,12,Math.PI,0);ctx.fill();
    ctx.fillStyle='#cc0000';ctx.fillRect(sx+3,e.y+9,e.w-6,e.h-9);
    ctx.fillStyle='#fff';ctx.fillRect(sx+6,e.y+12,4,4);ctx.fillRect(sx+14,e.y+12,4,4);
    ctx.fillStyle='#000';ctx.fillRect(sx+7+(e.dir>0?1:0),e.y+13,2,2);ctx.fillRect(sx+15+(e.dir>0?1:0),e.y+13,2,2);
  }
  // Flyers 🦇
  for(let f of levelData.flyers){
    if(f.dead)continue;
    let sx=f.x-camera.x;
    if(sx<-60||sx>W+60)continue;
    const lv=LEVELS[level%LEVELS.length];
    // Body
    ctx.fillStyle='#662288';
    ctx.beginPath();ctx.ellipse(sx+f.w/2,f.y+f.h/2,10,8,0,0,Math.PI*2);ctx.fill();
    // Wings flap
    let flap=Math.sin(timer*0.2+f.phase)*8;
    ctx.fillStyle=lv.accent+'cc';
    ctx.beginPath();ctx.ellipse(sx+4,f.y+f.h/2+flap,14,6,-.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(sx+f.w-4,f.y+f.h/2+flap,14,6,.4,0,Math.PI*2);ctx.fill();
    // Eyes
    ctx.fillStyle='#ff0066';
    ctx.beginPath();ctx.arc(sx+f.w/2-4,f.y+f.h/2-2,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+f.w/2+4,f.y+f.h/2-2,3,0,Math.PI*2);ctx.fill();
  }
}

function drawSpikes(){
  const lv=LEVELS[level%LEVELS.length];
  for(let s of levelData.spikes){
    let sx=s.x-camera.x;
    if(sx<-30||sx>W+30)continue;
    ctx.fillStyle=lv.accent;
    ctx.beginPath();
    ctx.moveTo(sx-10,s.y+TILE);
    ctx.lineTo(sx,s.y+4);
    ctx.lineTo(sx+10,s.y+TILE);
    ctx.fill();
    ctx.fillStyle='#ffffff55';
    ctx.beginPath();ctx.moveTo(sx-2,s.y+TILE);ctx.lineTo(sx,s.y+10);ctx.lineTo(sx+2,s.y+TILE);ctx.fill();
  }
}

function drawMovingPlatforms(){
  const lv=LEVELS[level%LEVELS.length];
  for(let mp of levelData.movingPlatforms){
    let sx=mp.x-camera.x;
    if(sx>W+100||sx<-100)continue;
    ctx.fillStyle='#ffcc0088';
    ctx.fillRect(sx,mp.y,mp.w,mp.h);
    ctx.fillStyle='#ffcc00';
    ctx.fillRect(sx,mp.y,mp.w,3);
    // Glowing edges
    ctx.strokeStyle=lv.accent+'88';
    ctx.lineWidth=1;
    ctx.strokeRect(sx,mp.y,mp.w,mp.h);
  }
}

function drawFlag(){
  let f=levelData.flag;let sx=f.x-camera.x;
  if(sx<-50||sx>W+50)return;
  const lv=LEVELS[level%LEVELS.length];
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(sx,f.y+70);ctx.lineTo(sx,f.y);ctx.stroke();
  ctx.fillStyle=lv.accent;
  ctx.beginPath();ctx.moveTo(sx,f.y);ctx.lineTo(sx+26,f.y+9);ctx.lineTo(sx,f.y+18);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='10px Courier New';ctx.textAlign='center';
  ctx.fillText('GOAL',sx,f.y+82);
}

function drawPlayer(p){
  if(p.dead)return;
  // Invincibility flash - skip every other 4 frames
  if(p.invincible>0 && Math.floor(timer/4)%2===0){
    // draw star effect instead of skipping entirely
    const lv=LEVELS[level%LEVELS.length];
    ctx.fillStyle=lv.accent+'88';
    let sx=p.x-camera.x;
    for(let i=0;i<6;i++){
      let a=timer*0.3+i*Math.PI/3;
      ctx.beginPath();
      ctx.arc(sx+p.w/2+Math.cos(a)*20,p.y+p.h/2+Math.sin(a)*20,4,0,Math.PI*2);
      ctx.fill();
    }
    return;
  }
  let sx=p.x-camera.x;
  let bob=p.onGround?0:-2;
  ctx.save();
  ctx.translate(sx+p.w/2,p.y+p.h/2+bob);
  if(p.faceDir<0)ctx.scale(-1,1);

  if(selectedChar==='crt'){
    ctx.fillStyle='#5a3a1a';ctx.fillRect(-10,4,20,17);
    ctx.fillStyle='#c8a87a';ctx.fillRect(-12,-18,24,22);
    ctx.fillStyle='#001a00';ctx.fillRect(-9,-15,18,16);
    ctx.fillStyle='#00ffcc';ctx.font='10px Courier New';ctx.textAlign='center';
    let face=p.vy<-3?'^o^':p.onGround?'^_^':'~_~';
    ctx.fillText(face,0,-4);
    ctx.fillStyle='#7a4a00';ctx.fillRect(-13,-21,26,5);ctx.fillRect(-8,-30,16,11);
    ctx.fillStyle='#2a2a5a';ctx.fillRect(-9,21,7,12);ctx.fillRect(2,21,7,12);
    ctx.fillStyle='#ffcc00';ctx.font='9px serif';ctx.fillText('★',0,13);
  } else {
    ctx.fillStyle='#888899';ctx.fillRect(-9,2,18,20);
    ctx.fillStyle='#aaaacc';ctx.fillRect(-7,4,5,16);
    ctx.fillStyle='#aaaacc';
    ctx.beginPath();ctx.ellipse(0,-10,10,12,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111122';ctx.fillRect(-10,-21,20,9);
    ctx.beginPath();ctx.arc(0,-19,10,Math.PI,0);ctx.fill();
    ctx.fillStyle='#00ccff';ctx.fillRect(-6,-14,4,4);ctx.fillRect(2,-14,4,4);
    ctx.fillStyle='#ffffff88';ctx.fillRect(-5,-13,2,2);ctx.fillRect(3,-13,2,2);
    ctx.fillStyle='#667788';ctx.fillRect(-9,22,7,12);ctx.fillRect(2,22,7,12);
    ctx.fillStyle='#ff6bff88';
    ctx.beginPath();ctx.arc(0,9,3,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawHUD(){
  document.getElementById('coins').textContent=coins;
  document.getElementById('lives').textContent=lives;
  document.getElementById('levelLabel').textContent=LEVELS[level%LEVELS.length].name;
}

function loop(){
  if(state!=='playing')return;
  timer++;
  ctx.clearRect(0,0,W,H);
  drawBG();
  updateCamera();
  drawPlatforms();
  drawMovingPlatforms();
  drawSpikes();
  drawFlag();
  drawCollectibles();
  drawEnemies();
  playerInput(p1);
  applyPhysics(p1,levelData.platforms);
  checkCollisions(p1);
  drawPlayer(p1);
  updateEnemies();
  drawHUD();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
